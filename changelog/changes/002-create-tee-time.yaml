databaseChangeLog:
  - changeSet:
      id: 002-create-tee-time
      author: tom.huang
      comment: Placeholder table. Columns not finalized yet — flesh out in a later changeset.
      changes:
        - createTable:
            tableName: tee_time
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
